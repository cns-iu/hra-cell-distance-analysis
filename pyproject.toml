[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hra-cell-distance-analysis"
dynamic = ["version"]
description = "Cell Distance Analysis for Spatial Omics Datasets, primarily focused on vascular cells."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT license"}
authors = [{name = "j-yash", email = "yashvrdnjain@gmail.com"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",
    "plotly>=7.1.0",
    "kaleido>=1.5.0",
    "nbformat>=5.11.1",
    "openpyxl>=3.1.5",
    "scanpy>=1.12.5",
    "anndata>=0.13.4",
    "h5py>=3.16.0",
    "statsmodels>=0.15.0",
    "scikit-learn>=1.9.1",
    "scikit-posthocs>=0.16.1",
    "requests>=2.34.2",
    "ipykernel>=7.3.0",
]

[project.optional-dependencies]
docs = ["nbdev>=3.3.15"]

[project.urls]
Repository = "https://github.com/cns-iu/hra-cell-distance-analysis"
Documentation = "https://cns-iu.github.io/hra-cell-distance-analysis"

[project.entry-points.nbdev]
hra_cell_distance_analysis = "hra_cell_distance_analysis._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "hra_cell_distance_analysis.__version__"}

[tool.setuptools.packages.find]
include = ["hra_cell_distance_analysis"]

[tool.nbdev]
title = 'HRA: Cell Distance Analysis'
